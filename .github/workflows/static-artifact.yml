name: Validate static artifact

on:
  pull_request:
  push:
    branches: ["main", "static-directory"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: al-amin-static-out
          path: out/
          if-no-files-found: error
          retention-days: 14

      # Production deployment is intentionally absent.
      # Enable a hosting adapter only after a separate owner decision.
